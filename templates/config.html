<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Config Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .tabs-header { display: flex; background: #ffffff; padding: 15px 20px 0 20px; border-bottom: 1px solid #e5e7eb; max-width: 1050px; margin: 0 auto; border-radius: 12px 12px 0 0; }
        .tab-btn { padding: 14px 28px; font-weight: bold; font-size: 15px; border: none; background: #ffffff; cursor: pointer; text-decoration: none; color: #4b5563; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-btn:hover { color: #111827; background-color: #f9fafb; }
        .tab-btn.active { background-color: #ffeb3b; color: #000000; }
        .main-display-panel { display: flex; gap: 40px; background: #ffffff; padding: 40px; border-radius: 0 0 12px 12px; max-width: 1050px; margin: 0 auto; min-height: 500px; border: 1px solid #e5e7eb; border-top: none; }
        .policy-card { width: 260px; border: 1px solid #d1d5db; border-radius: 8px; padding: 25px; background: #ffffff; height: fit-content; }
        .policy-card h4 { font-size: 16px; color: #111827; text-decoration: underline; margin-bottom: 15px; font-weight: bold; text-underline-offset: 4px; }
        .policy-item { font-size: 14px; color: #374151; margin-bottom: 10px; font-weight: 500; list-style: none; }
        .toggles-group { flex: 1; padding-left: 20px; padding-top: 10px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; max-width: 420px; margin-bottom: 30px; }
        .toggle-label { font-size: 16px; font-weight: 600; color: #111827; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e5e7eb; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <div class="tabs-header">
    <a href="/home" class="tab-btn">Home</a>
    <a href="/config" class="tab-btn active">Config</a>
    <a href="/rules" class="tab-btn">Rules</a>
    <a href="/report" class="tab-btn">Report</a>
    </div>
    
    <div class="main-display-panel">
        <div class="policy-card">
            <h4>password policy</h4>
            <ul>
                <li class="policy-item">Max length - 16</li>
                <li class="policy-item">Min length - 8</li>
                <li class="policy-item">Min Upper case - 1</li>
                <li class="policy-item">Min Lower case - 1</li>
                <li class="policy-item">Number - 1</li>
            </ul>
        </div>
        
        <div class="toggles-group">
            <div class="toggle-row">
                <span class="toggle-label">Data Pulling</span>
                <label class="switch">
                    <input type="checkbox" id="dataPullingToggleBtn" onclick="sendOperationToggleUpdate('data_pulling', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <span class="toggle-label">Rule engine</span>
                <label class="switch">
                    <input type="checkbox" id="ruleEngineToggleBtn" onclick="sendOperationToggleUpdate('rule_engine', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        async function fetchSavedSettingsStateFromDatabase() {
            try {
                var response = await fetch('/api/get-settings');
                var activeConfig = await response.json();
                // Correctly maps identifiers to match your slider checkboxes
                document.getElementById('dataPullingToggleBtn').checked = activeConfig['data_pulling'] || false;
                document.getElementById('ruleEngineToggleBtn').checked = activeConfig['rule_engine'] || false;
            } catch(e) { console.error(e); }
        }

        async function sendOperationToggleUpdate(settingKey, isCheckedValue) {
            try {
                await fetch('/api/update-setting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: settingKey, value: isCheckedValue })
                });
            } catch(e) { alert("Save error"); }
        }

        fetchSavedSettingsStateFromDatabase();
    </script>
</body>
</html>
