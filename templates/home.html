<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Predictive Dashboard & Threat Analytics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; padding: 20px; }
        .workspace-container { width: 100%; max-width: 1100px; margin: 20px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        .tabs-header { display: flex; background: #ffffff; padding: 15px 20px 0 20px; border-bottom: 1px solid #e5e7eb; }
        .tab-btn { padding: 14px 28px; font-weight: bold; font-size: 15px; border: none; background: #ffffff; cursor: pointer; text-decoration: none; color: #4b5563; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-btn:hover { color: #111827; background-color: #f9fafb; }
        .tab-btn.active { background-color: #ffeb3b; color: #000000; }
        .content-area { padding: 30px; }
        .content-title { font-size: 22px; font-weight: bold; margin-bottom: 25px; color: #111827; }
        .analytics-grid-workspace { display: flex; gap: 25px; margin-bottom: 10px; width: 100%; align-items: stretch; }
        .chart-card-panel { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; flex: 1; min-height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .chart-card-panel.bar-width { flex: 1.5; }
        .chart-heading-lbl { font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 20px; text-transform: uppercase; width: 100%; text-align: left; letter-spacing: 0.02em; }
        .matplotlib-img { max-width: 100%; height: auto; object-fit: contain; }
    </style>
</head>
<body>
    <div class="workspace-container">
        <div class="tabs-header">
            <a href="/home" class="tab-btn active">Home</a>
            <a href="/config" class="tab-btn">Config</a>
            <a href="/rules" class="tab-btn">Rules</a>
            <a href="/report" class="tab-btn">Report</a>
        </div>
        <div class="content-area">
            <div class="content-title">AI Predictive Dashboard & Threat Analytics</div>
            <div class="analytics-grid-workspace">
                <!--Left panel bar chart -->
                <div class="chart-card-panel bar-width">
                    <div class="chart-heading-lbl">📊 Trailing 3-Day Alert Timeline History</div>
                    <img src="/api/get-bar-chart.png" class="matplotlib-img" alt="Timeline Analytics Image Fetch Mismatch">
                </div>
                
                <!-- Right panel pie chart -->
                <div class="chart-card-panel">
                    <div class="chart-heading-lbl">📊 Threat Volumetric Proportions (%)</div>
                    <img src="/api/get-pie-chart.png" class="matplotlib-img" alt="Proportions Analytics Image Fetch Mismatch">
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
