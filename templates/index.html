<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compliance Platform Portal Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card-panel { background: #ffffff; padding: 40px; border-radius: 12px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); text-align: center; }
        .portal-title-lbl { font-size: 24px; font-weight: bold; color: #0f172a; margin-bottom: 30px; }
        .input-group-row { text-align: left; margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .input-group-row label { font-size: 12px; font-weight: bold; color: #475569; text-transform: uppercase; }
        .text-input-field { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; color: #0f172a; background-color: #f8fafc; }
        .text-input-field:focus { outline: none; border-color: #2563eb; background-color: #ffffff; }
        .primary-action-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 12px; transition: background-color 0.2s; }
        .primary-action-btn.blue { background-color: #2563eb; }
        .primary-action-btn.blue:hover { background-color: #1d4ed8; }
        .primary-action-btn.green { background-color: #10b981; }
        .primary-action-btn.green:hover { background-color: #059669; }
        .forgot-link-anchor { display: inline-block; margin-top: 15px; font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
        .forgot-link-anchor:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card-panel">
        <div class="portal-title-lbl">Account Authentication</div>
        <form onsubmit="event.preventDefault();">
            <div class="input-group-row">
                <label>Username</label>
                <input type="text" id="usernameField" class="text-input-field" placeholder="Enter username" value="Souri892536">
            </div>
            <div class="input-group-row">
                <label>Password</label>
                <input type="password" id="passwordField" class="text-input-field" placeholder="Enter password">
            </div>
            <button class="primary-action-btn blue" onclick="processUserLogin()">Sign In</button>
            <button class="primary-action-btn green" onclick="processUserRegistration()">Create Account</button>
        </form>
        <a href="#" class="forgot-link-anchor">Forgot Password?</a>
    </div>
    <!--  Captures input fields into memory variables correctly [INDEX] -->
    <script>
        async function processUserLogin() {
            // Pull the real values from the interface form field nodes on user click [INDEX]
            var user = document.getElementById('usernameField').value.trim();
            var pass = document.getElementById('passwordField').value;
            
            if (!user || !pass) {
                alert("Please enter credentials.");
                return;
            }

            try {
                var payloadBody = {
                    username: user,
                    password: pass
                };

                var response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payloadBody)
                });

                if (response.ok) {
                    // Redirect straight to dashboard interface layout context [INDEX]
                    window.location.href = '/home';
                } else {
                    alert("Invalid username or password match configuration.");
                }
            } catch(err) {
                alert("Network pipeline timeout error.");
            }
        }

        async function processUserRegistration() {
            var user = document.getElementById('usernameField').value.trim();
            var pass = document.getElementById('passwordField').value;
            
            if (!user || !pass) {
                alert("Please enter credentials.");
                return;
            }

            try {
                var payloadBody = {
                    username: user,
                    password: pass
                };

                var response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payloadBody)
                });

                if (response.ok) {
                    alert("Account registration initialized successfully.");
                } else {
                    alert("Database failed to compile new user metadata profiles.");
                }
            } catch(err) {
                alert("Network pipeline registration timeout error.");
            }
        }
    </script>
</body>
</html>
