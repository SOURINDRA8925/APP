<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Rules Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f3f4f6; padding: 20px; }
        .workspace-container { width: 100%; max-width: 1050px; margin: 30px auto; min-height: 560px; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .tabs-header { display: flex; background: #ffffff; padding: 15px 20px 0 20px; border-bottom: 1px solid #e5e7eb; }
        .tab-btn { padding: 14px 28px; font-weight: bold; font-size: 15px; border: none; background: #ffffff; cursor: pointer; text-decoration: none; color: #4b5563; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background-color: #ffeb3b; color: #000000; }
        .main-display-panel { display: flex; min-height: 500px; }
        .sidebar { width: 30%; border-right: 1px solid #e5e7eb; padding: 20px; background-color: #f9fafb; }
        .content-area { width: 70%; padding: 30px; }
        .btn-blue { background-color: #2563eb; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 14px; }
        .rule-item { padding: 12px 15px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; cursor: pointer; font-weight: 600; color: #374151; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { color: #dc2626; border: none; background: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .condition-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .condition-row select, .condition-row input { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; height: 42px; }
        .btn-sec { background: #475569; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 20px; border: none; }
        .btn-green { background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="workspace-container">
        <div class="tabs-header">
    <a href="/home" class="tab-btn">Home</a>
    <a href="/config" class="tab-btn">Config</a>
    <a href="/rules" class="tab-btn active">Rules</a>
    <a href="/report" class="tab-btn">Report</a>
    </div>


        <div class="main-display-panel">
            <div class="sidebar">
                <button class="btn-blue" onclick="openNewRuleForm()">+ Add Rule</button>
                <div id="rulesSidebarList"></div>
            </div>
            <div class="content-area" id="rulesContentAreaWorkspace">
                <h3 style="color: #6b7280; text-align: center; margin-top: 100px;">Select or Add a Rule</h3>
            </div>
        </div>
    </div>
    <script>
        var globalRulesMemory = [];
        async function loadSystemRulesFromDatabase() {
            try {
                var res = await fetch('/api/get-rules');
                globalRulesMemory = await res.json();
                renderRulesSidebarList();
            } catch(e) { console.error(e); }
        }
        function renderRulesSidebarList() {
            var container = document.getElementById('rulesSidebarList'); container.innerHTML = '';
            globalRulesMemory.forEach(function(rule) {
                var div = document.createElement('div'); div.className = 'rule-item';
                div.innerHTML = '<span>' + rule.name + '</span><button class="delete-btn" onclick="deleteRuleTrack(event, ' + rule.id + ')">Delete</button>';
                div.onclick = function() { renderSelectedRuleView(rule.id); }; container.appendChild(div);
            });
        }
        function openNewRuleForm() {
            document.getElementById('rulesContentAreaWorkspace').innerHTML = '<h3>Configure Rule Matrix</h3><div style="display:flex; gap:20px; margin-top:20px;"><div style="flex:1;"><label style="font-weight:bold; font-size:14px;">RULE NAME</label><input type="text" id="newRuleFieldName" class="form-control" placeholder="Enter rule name"></div><div style="flex:1;"><label style="font-weight:bold; font-size:14px;">RULE DESCRIPTION</label><input type="text" id="newRuleFieldDesc" class="form-control" placeholder="Enter objective summary"></div></div><h4 style="margin:20px 0 10px 0;">CONDITION ROWS</h4><div id="formConditionsRowsContainer"></div><button class="btn-sec" onclick="appendNewConditionInputRow()">+ Add Condition Row</button><div style="text-align:right; margin-top:20px;"><button class="btn-green" onclick="submitRuleFormPayload()">Save Rule Configuration</button></div>';
            appendNewConditionInputRow();
        }
        function appendNewConditionInputRow() {
            var container = document.getElementById('formConditionsRowsContainer'); var row = document.createElement('div'); row.className = 'condition-row';
            // FIXED ELEMENT IDENTIFIER: Explicitly attaches class="cond-logic" to keep parameters synced
            row.innerHTML = '<select class="cond-param" style="width:28%;"><option value="aod">Account Opening Days</option><option value="Narration">Narration</option><option value="Amount">Amount</option><option value="drcr">DrCr (cr/dr)</option><option value="channel">Channel</option><option value="credit">Cumulative Credit</option><option value="debit">Cumulative Debit</option></select><select class="cond-oper" style="width:12%;"><option value="=">=</option><option value="!=">!=</option><option value=">">&gt;</option><option value="<">&lt;</option></select><input type="text" class="cond-val" style="width:38%;" placeholder="Value..."><select class="cond-logic" style="width:14%;"><option value="AND">AND</option><option value="OR">OR</option></select><button style="background:#ef4444; color:white; border:none; border-radius:6px; width:38px; height:38px; font-weight:bold; cursor:pointer;" onclick="this.parentElement.remove()">×</button>';
            container.appendChild(row);
        }
        async function submitRuleFormPayload() {
            var name = document.getElementById('newRuleFieldName').value.trim(); var desc = document.getElementById('newRuleFieldDesc').value.trim(); if(!name) return;
            var condRows = document.querySelectorAll('.condition-row'); var conditionsArray = [];
            condRows.forEach(function(row) {
                var p = row.querySelector('.cond-param').value; var o = row.querySelector('.cond-oper').value; var v = row.querySelector('.cond-val').value.trim(); var l = row.querySelector('.cond-logic').value;
                if(v) { conditionsArray.push({ parameter: p, operator: o, value: v + ' [' + l + ']' }); }
            });
            if(conditionsArray.length === 0) return;
            try {
                var res = await fetch('/api/save-rule', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rule_name: name, rule_description: desc, conditions: conditionsArray }) });
                if(res.ok) { loadSystemRulesFromDatabase(); document.getElementById('rulesContentAreaWorkspace').innerHTML = '<h3>Select or Add a Rule</h3>'; }
            } catch(e) { console.error(e); }
        }
        function renderSelectedRuleView(ruleId) {
            var rule = globalRulesMemory.find(function(r) { return r.id === ruleId; }); if(!rule) return;
            var condsHtml = ''; rule.conditions.forEach(function(c) { condsHtml += '<div style="font-family:monospace; background:#ffffff; padding:8px 12px; border:1px solid #e5e7eb; border-radius:4px; margin-top:6px;">📌 <b>' + c.parameter + '</b> ' + c.operator + ' <span>' + c.value + '</span></div>'; });
            document.getElementById('rulesContentAreaWorkspace').innerHTML = '<div style="background:#fafafa; border:1px solid #e5e7eb; padding:20px; border-radius:8px;"><div style="font-size:18px; font-weight:bold; margin-bottom:10px;">' + rule.name + '</div><p style="color:#4b5563; font-size:14px; margin-bottom:15px;">' + (rule.description || 'No description.') + '</p><h4>Active Validation Logic</h4><div>' + condsHtml + '</div></div>';
        }
        async function deleteRuleTrack(event, ruleId) {
            event.stopPropagation(); if(!confirm("Erase this rule?")) return;
            try {
                var res = await fetch('/api/delete-rule/' + ruleId, { method: 'DELETE' });
                if(res.ok) { loadSystemRulesFromDatabase(); document.getElementById('rulesContentAreaWorkspace').innerHTML = '<h3>Select or Add a Rule</h3>'; }
            } catch(e) { console.error(e); }
        }
        loadSystemRulesFromDatabase();
    </script>
</body>
</html>
